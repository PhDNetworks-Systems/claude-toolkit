name: Documentation Check

# Hosted execution is an optional manual fallback; do not dispatch paid runs by default.
on:
  workflow_dispatch:

jobs:
  check-docs:
    # Match the unchanged reusable job permission; this caller disables auto-generation.
    permissions:
      contents: write
    uses: ./.github/workflows/check-required-docs.yml
    with:
      auto_create: false
